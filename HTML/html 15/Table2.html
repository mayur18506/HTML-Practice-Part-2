<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>colspan</title>
</head>
<body>
    <h1 align="centre">Colspan</h1>

    <table border="1" align="centre" width="50%" cellpadding="10px" cellspacing="0px">
        <tr>
            <td height="100px">A</td>
            <td>B</td>
        </tr>
        <tr>
            <td height="100px" colspan="2">C Lorem ipsum dolor sit amet consectetur adipisicing elit. Sed maiores asperiores deserunt beatae in voluptas libero numquam explicabo dolorum debitis.</td>
            
           
        </tr>
         <tr>
            <td height="100px">E</td>
            <td>F</td>
        </tr>
    </table>

    <h1 align="centre">rowspan</h1>

    <table border="1" align="centre" width="50%" cellpadding="10px" cellspacing="0px">
        <caption>Student Record</caption>
        <tr>
            <td height="100px">A</td>
            <td>B</td>
        </tr>
        <tr>
            <td height="100px" rowspan="2">C </td>
            <td>D</td>
           
        </tr>
         <tr>
            
            <td height="100px">F</td>
        </tr>
    </table>
</body>
</html>
