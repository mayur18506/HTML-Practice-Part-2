<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Input Tags</title>
</head>

<body>
    <label for="">Select Color</label> <input type="color" name=""> <br><br>

    <label for="">Number</label> <input type="number" min="0" max="100" step="10" name=""> <br><br>

    <label for="">Range</label> <input type="range" min="0" max="100" step="10" name=""> <br><br>

    <label for="">Date</label> <input type="date" name=""> <br><br>

    <label for="">Date Time</label> <input type="datetime-local" name=""> <br><br>

    <label for="">Month</label> <input type="month" name=""> <br><br>

    <label for="">Week</label> <input type="week" name=""> <br><br>

    <label for="">Time</label> <input type="time" name=""> <br><br>


</body>

</html>
